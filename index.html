 h+='<div class="card" style="--c:'+COL[QC[x[0]]]+'" data-a="qtog" data-i="'+i+'"><span class="tag">'+x[0]+'</span><div class="q">“'+esc(x[2])+'”</div><div class="mu">— '+esc(x[1])+"</div>"+(o?'<div class="mean"><b>MEANING</b><div style="margin-top:4px">'+esc(x[3])+"</div></div>":'<div class="mu sm" style="margin-top:6px">tap for meaning ▾</div>')+"</div>";});
 return h||'<div class="mu">No matches.</div>';}
function vMore(){var g=S.goals,h='<h1>SETTINGS + WISDOM</h1><h2>More</h2><div class="chips"><button class="chip'+(sub.more=="data"?" on":"")+'" data-a="sub" data-s="more" data-v="data">DATA + GOALS</button><button class="chip'+(sub.more=="quotes"?" on":"")+'" data-a="sub" data-s="more" data-v="quotes">💭 QUOTES</button></div>';if(sub.more=="quotes")return h+vQuotes();
 h+='<div class="card" style="--c:var(--red)"><b>🧪 Lab results</b><div class="sm" style="margin-top:6px">Coming soon: a place for results, dates and trends.</div><label style="margin-top:10px">My notes</label><textarea id="bl" placeholder="Write anything you want to remember...">'+esc(S.blood)+'</textarea><button class="btn full" data-a="saveblood">SAVE NOTE</button></div>';
 h+='<h3>Daily goals + height</h3><form class="card" data-f="goals"><div class="grid"><div><label>Calories</label><input name="k" type="number" inputmode="numeric" value="'+g.k+'"></div><div><label>Protein g</label><input name="p" type="number" inputmode="numeric" value="'+g.p+'"></div><div><label>Carbs g</label><input name="c" type="number" inputmode="numeric" value="'+g.c+'"></div><div><label>Fat g</label><input name="f" type="number" inputmode="numeric" value="'+g.f+'"></div><div><label>Height in</label><input name="h" type="number" inputmode="decimal" step="any" value="'+S.height+'"></div></div><button class="btn full">SAVE GOALS</button></form>';
 h+='<h3>Your data</h3><div class="card"><div class="sm">'+(storeOK?"Saved on this device and browser.":"This browser is blocking storage. Copy a backup often.")+'</div><div class="mu sm">Opening from the Home Screen icon uses the same saved data as Safari. Data does not move between different browsers or phones.</div><button class="btn full" data-a="exp">SHOW BACKUP TEXT</button><textarea id="bk" style="display:none;margin-top:8px" readonly></textarea><button class="btn full" data-a="copy" style="display:none" id="cp">COPY</button><label style="margin-top:12px">Restore: paste backup text</label><textarea id="im" placeholder="Paste backup here"></textarea><button class="btn full" data-a="imp">RESTORE FROM PASTED TEXT</button></div>';
 h+='<div class="card" style="display:none"><b>Cloud backup</b><div class="mu sm" id="cm">'+esc(cloud.msg)+'</div><div class="row" style="margin-top:8px"><button class="btn s g" data-a="cup">BACK UP NOW</button><button class="btn s g" data-a="cdn">RESTORE</button></div></div>';
 return h+'<div class="mu sm" style="margin-top:14px">Calories and protein are estimates. Carbs and fat on plan meals are rough.</div>';}

/* ---------- render ---------- */
function render(){var t=TABS.filter(function(x){return x[0]==tab;})[0];document.body.style.setProperty("--c",COL[t[3]]);
 document.getElementById("app").innerHTML=({today:vToday,food:vFood,train:vTrain,meals:vMeals,body:vBody,more:vMore})[tab]();
 document.getElementById("nav").innerHTML=TABS.map(function(x){return'<button class="'+(x[0]==tab?"on":"")+'" style="--tc:'+COL[x[3]]+'" data-a="goto" data-t="'+x[0]+'"><span>'+x[1]+"</span>"+x[2]+"</button>";}).join("");}
function shiftDate(n){var d=pd(cur);d.setDate(d.getDate()+n);cur=ymd(d);}
function addFood(n,k,p,c,f){(S.food[cur]=S.food[cur]||[]).push({id:uid(),n:n,k:num(k),p:num(p),c:num(c),f:num(f)});save();}
function rm(arr,id){for(var i=0;i<arr.length;i++)if(arr[i].id==id){arr.splice(i,1);return;}}

var A={
goto:function(b){tab=b.dataset.t;window.scrollTo(0,0);render();},
dprev:function(){shiftDate(-1);render();},dnext:function(){shiftDate(1);render();},
sub:function(b){sub[b.dataset.s]=b.dataset.v;render();},
logmeal:function(b){var m=M[b.dataset.k];addFood(m[1],m[2],m[3],m[4],m[5]);toast("Logged "+m[1].split(" + ")[0]);if(tab=="food")render();},
logrec:function(b){var f=null;Object.keys(S.food).some(function(d){return S.food[d].some(function(e){if(e.id==b.dataset.id){f=e;return true;}});});if(f){addFood(f.n,f.k,f.p,f.c,f.f);toast("Logged "+f.n);render();}},
delfood:function(b){rm(S.food[cur]||[],b.dataset.id);save();render();},
delwork:function(b){rm(S.work[cur]||[],b.dataset.id);save();render();},
delbody:function(b){rm(S.body,b.dataset.id);save();render();},
pick:function(b){var e=EX[b.dataset.i],i=document.getElementById("wn");i.value=e[0];lastNote();document.querySelector('[data-f="work"]').scrollIntoView({behavior:"smooth",block:"center"});},
tdayf:function(b){fil.tday=b.dataset.v;render();},mdayf:function(b){fil.mday=b.dataset.v;render();},
qcat:function(b){fil.qc=b.dataset.v;render();},qtog:function(b){var i=b.dataset.i;fil.qo[i]=!fil.qo[i];document.getElementById("ql").innerHTML=qList();},qrand:function(){var i=Math.floor(Math.random()*Q.length);fil.qc="ALL";fil.qq="";fil.qo={};fil.qo[i]=true;render();var e=document.querySelector('[data-i="'+i+'"]');if(e&&e.scrollIntoView)e.scrollIntoView({behavior:"smooth",block:"center"});},
chk:function(b){S.checks["s"+b.dataset.i]=b.checked;save();render();},
unchk:function(){S.checks={};save();render();},
saveblood:function(){S.blood=document.getElementById("bl").value;save();toast("Note saved");},
exp:function(){var t=document.getElementById("bk");t.value=JSON.stringify(S);t.style.display="block";document.getElementById("cp").style.display="block";t.focus();t.select();},
copy:function(){var t=document.getElementById("bk");t.select();try{navigator.clipboard.writeText(t.value).then(function(){toast("Copied");},function(){toast("Press and hold, then Copy");});}catch(e){toast("Press and hold, then Copy");}},
imp:function(){var v=document.getElementById("im").value.trim();try{var o=JSON.parse(v);if(!o||typeof o!="object"||!o.goals)throw 0;S=o;var b=blank();for(var k in b)if(S[k]===undefined)S[k]=b[k];save();toast("Restored");render();}catch(e){toast("That text is not a valid backup");}},
cup:function(){cloudPush(true);},cdn:function(){cloudPull();}};
document.addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(!b||b.tagName=="INPUT"&&b.type=="checkbox")return;if(b.tagName=="A")return;var f=A[b.dataset.a];if(f)f(b);});
document.addEventListener("change",function(e){var b=e.target;if(b.dataset&&b.dataset.a=="chk")A.chk(b);if(b.id=="wn")lastNote();});
document.addEventListener("input",function(e){var b=e.target;if(b.id=="exq"){fil.mus=b.value;document.getElementById("exl2").innerHTML=exList();}if(b.id=="qq"){fil.qq=b.value;document.getElementById("ql").innerHTML=qList();}if(b.id=="rq")document.getElementById("rl").innerHTML=recList(b.value);if(b.id=="wn")lastNote();});
function lastNote(){var i=document.getElementById("wn"),o=document.getElementById("last");if(!i||!o)return;var l=lastOf(i.value);o.textContent=l?"Last: "+(l.e.s||"-")+" x "+(l.e.r||"-")+(l.e.w?" @ "+l.e.w+" lb":"")+" on "+lab(l.d):"";}
document.addEventListener("submit",function(e){e.preventDefault();var f=e.target,t=f.dataset.f,v=function(n){return f.elements[n]?f.elements[n].value:"";};
 if(t=="food"){addFood(v("n").trim(),v("k"),v("p"),v("c"),v("f"));toast("Added");render();}
 else if(t=="work"){(S.work[cur]=S.work[cur]||[]).push({id:uid(),n:v("n").trim(),s:v("s"),r:v("r"),w:v("w"),o:v("o").trim()});save();toast("Logged");render();}
 else if(t=="body"){var o={id:uid(),date:cur},any=false;["wt","bf","waist","chest","sh","arm","th"].forEach(function(n){if(v(n)!==""){o[n]=num(v(n));any=true;}});if(!any){toast("Enter at least one number");return;}S.body=S.body.filter(function(x){return x.date!=cur;});S.body.push(o);save();toast("Saved");render();}
 else if(t=="goals"){S.goals={k:num(v("k")),p:num(v("p")),c:num(v("c")),f:num(v("f"))};if(num(v("h"))>0)S.height=num(v("h"));save();toast("Saved");}});

/* ---------- optional cloud backup (online only) ---------- */
function setMsg(t){cloud.msg=t;var e=document.getElementById("cm");if(e)e.textContent=t;}
function cloudSoon(){if(!cloud.ref)return;clearTimeout(ct);ct=setTimeout(function(){cloudPush(false);},2500);}
function cloudPush(manual){if(!cloud.ref){setMsg("Cloud backup is not available right now.");if(manual)toast("Not available");return;}
 try{Promise.resolve(cloud.ref.set({json:JSON.stringify(S),at:Date.now()})).then(function(){setMsg("Cloud backup saved "+new Date().toLocaleTimeString());if(manual)toast("Backed up");},function(){setMsg("Cloud backup failed (are you online?)");});}catch(e){setMsg("Cloud backup failed.");}}
function cloudPull(){if(!cloud.ref){toast("Not available");return;}
 try{Promise.resolve(cloud.ref.get()).then(function(s){var d=s&&(typeof s.data=="function"?s.data():s);if(d&&d.json){S=JSON.parse(d.json);var b=blank();for(var k in b)if(S[k]===undefined)S[k]=b[k];save();toast("Restored from cloud");render();}else toast("No cloud backup yet");},function(){toast("Could not reach cloud");});}catch(e){toast("Could not reach cloud");}}
(function(){try{if(!window.claude||!claude.use)return;var to=function(p){return Promise.race([p,new Promise(function(r){setTimeout(function(){r(null);},10000);})]);};
 to(Promise.all([claude.use("db"),claude.use("user")])).then(function(r){if(!r||!r[0]||!r[1])return;return Promise.resolve(r[1].id()).then(function(id){cloud.ref=r[0].collection("data/users/"+id).doc("myplan");setMsg("Cloud backup is on. It saves automatically when you are online.");});}).catch(function(){});}catch(e){}})();

render();
</script>
</body>
